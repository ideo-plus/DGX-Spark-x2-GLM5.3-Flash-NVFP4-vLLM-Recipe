[configs.probe-nightly.args.model-path]
# flag を書かないと、位置の引数になる
value = "{weights.mount_at}"
why = "vllm serve の第一の位置の引数が、モデルの場所である。ここには設定とトークナイザだけがあり、重みは --load-format dummy で作る"
source = "https://github.com/vllm-project/vllm/blob/385dce36bcee42309924a5ece951a96db3dce7f2/vllm/entrypoints/cli/serve.py"
quote = "usage=\"vllm serve [model_tag] [options]\""

[configs.probe-nightly.args.served-model-name]
flag = "--served-model-name"
value = "glm-5-3-flash"
why = "/v1/models の id を、/ を含まない 1 つの名前に固定する (requirements 6.2)。段 0 と段 2 で同じ名前にして、確かめの筋道を変えない"
source = "https://github.com/vllm-project/vllm/blob/385dce36bcee42309924a5ece951a96db3dce7f2/vllm/config/model.py"
quote = "The model name(s) used in the API. If multiple names are provided, the server will respond to any of the provided names. The model name in the model field of a response will be the first name in this list. …"

