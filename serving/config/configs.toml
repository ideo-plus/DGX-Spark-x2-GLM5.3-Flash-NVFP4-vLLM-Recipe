# ===========================================================================
# p1-image-licenses — イメージの中のライセンスの表記を読む (requirements 3.8、3.9)
# ===========================================================================
#
# 重みの参照も --mount も持たない。読むファイルの道筋は、位置の引数で渡す。
#
# 読む道筋の決め方: 固定したイメージの Dockerfile は、ライセンスのファイルをイメージに
# 置かず、`org.opencontainers.image.licenses` のラベルも付けない (`docker/Dockerfile` を
# 全文で確かめた)。したがってイメージの中の表記は、ベースのイメージ
# (`nvidia/cuda:13.0.3-base-ubuntu24.04`。`docker/versions.json` の FINAL_BASE_IMAGE) 由来
# のものだけである。そのベースのイメージは、NVIDIA 自身の公開のリポジトリ
# (`gitlab.com/nvidia/container-images/cuda`) の、版で分かれた道筋
# `dist/13.0.3/ubuntu2404/base/Dockerfile` から作られ、そこに `COPY NGC-DL-CONTAINER-LICENSE /`
# の行がある (arm64 と amd64 を束ねた `FROM base-${TARGETARCH}` より後ろの行なので、
# arm64 (NVARCH=sbsa) のイメージにも入る)。→ 読む道筋は `/NGC-DL-CONTAINER-LICENSE` である。
#
# 読むファイルが無ければ、cat は 0 以外で終わり、`serve image-licenses` はその終了コードと
# 標準エラーを、そのまま計測者に見せる (それも 7.1 の判断の材料になる)。

[configs.p1-image-licenses]
kind = "inspect"
description = "固定したイメージの中の、ライセンスの表記を読む (LICENSES.md に書くため)"
nodes = ["head"]
# cat を 1 回流すだけなので、数秒で終わる
ready_timeout_s = 120

[configs.p1-image-licenses.image]
ref = "vllm/vllm-openai@sha256:b0501f99fec5136f248f78d5850977a2ec32d55cd9a665f4a9ffef24cbdf7fe5"
seen_as = "vllm/vllm-openai:glm53-flash-arm64-cu130"
size_bytes = 9666567584
source = "https://hub.docker.com/v2/repositories/vllm/vllm-openai/tags"
quote = "glm53-flash-arm64-cu130 / linux/arm64 / 9666567584 B / 2026-09-09T13:31:25Z"

[configs.p1-image-licenses.docker.entrypoint]
flag = "--entrypoint"
value = "cat"
why = "イメージの既定は vllm serve なので、ファイルをそのまま出す道具に差し替える (中身を加工しない)"
