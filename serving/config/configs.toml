# ===========================================================================
# glm53-tp2-mtp3-marlin — 45 tok/s に届いた構成 (k2s4 + MTP N=3 + --moe-backend marlin。issue #103)
# ===========================================================================
#
# 実機で serve check・start・計測まで通った構成 (2026-09-28 の確認の段、fast、出力 256、N = 3)。
# コード・英語 45.0 tok/s、散文・日本語 42.2 tok/s、壊れなし。実測は docs/results/2026-09-28-k2-stage3.md。

[configs.glm53-tp2-mtp3-marlin]
kind = "serve"
description = "NoPE 修正イメージ (vllm-nope:0961bbae-fi070) で、2 台 TP=2 の full と同じ構成に、モデル付属の MTP を下書き 3 トークンで有効にし、MoE の実装を Marlin にする。重みは、手元で変換した派生の重み k2s4 (元: RedHatAI/GLM-5.3-Flash-NVFP4@18d55bfd5a2194887738da73753975c9d3842f46、変換 experiments/k2-quant@949fb930)。2026-09-28 の確認の段 (fast、出力 256、N = 3) で、コード・英語 45.0 tok/s、散文・日本語 42.2 tok/s、壊れなし (docs/results/2026-09-28-k2-stage3.md の「k2s4 ＋ Marlin」の節)。固定した vLLM の直したファイル (vllm/model_executor/layers/vocab_parallel_embedding.py, vllm/models/glm5next/common/model.py, vllm/models/glm5next/common/kda.py) を、読み取り専用の bind mount で重ねる (vllm-overlay k2s2b。ADR 0007 の第 2b 段、#79)。KV キャッシュは --kv-cache-memory-bytes で 1 台あたり 4 GiB に固定する (既定の量 12.82 GiB では cold 128k の入力でエンジンが止まったため。#135、docs/results/2026-09-30-fast-prefill-long-input.md)。サーバーの既定の思考の深さは --default-chat-template-kwargs で low にする (既定の最大では、コードの課題で答えが本文に出なかったため。#158。要求の側の chat_template_kwargs の reasoning_effort が優先される)"
nodes = ["head", "worker"]
# 初回は 1 台あたり約 92 GiB の読み込みと JIT があるので長く取る。実測で直す
# (直しても config-sha256 は変わらないので、動いているサーバーを止めずに済む)
ready_timeout_s = 1800
served_model_name = "glm-5-3-flash"
