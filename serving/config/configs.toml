# ===========================================================================
# netcheck-bandwidth — 2 台の間の帯域を測る (requirements 4.3、4.4、4.6)
# ===========================================================================
#
# イメージの中の torchrun で、自前の all-reduce の計測 (`payload/allreduce_bench.py`) を
# 2 台で流す。nccl-tests は MPI が要り、Spark に恒久的な変更を入れることになるので使わない。
