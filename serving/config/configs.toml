source = "https://github.com/vllm-project/vllm/blob/385dce36bcee42309924a5ece951a96db3dce7f2/vllm/entrypoints/launchers/cli_args.py"
quote = "Port number."

[configs.probe-nightly.args.load-format]
flag = "--load-format"
value = "dummy"
why = "重みを 1 バイトも取得せずに、同じ経路で起動を試す (184.3 GiB は 1 台に収まらない。requirements 5.1)"
source = "https://github.com/vllm-project/vllm/blob/385dce36bcee42309924a5ece951a96db3dce7f2/vllm/config/load.py"
quote = '"dummy" will initialize the weights with random values, which is mainly for profiling. …'

[configs.probe-nightly.args.hf-overrides]
flag = "--hf-overrides"
# 層を 45 から 4 に減らす。並びは、このリポジトリと版の config.json の先頭の 4 層を、
# そのまま取ったものである:
#   layer_types[0:4]      = linear_attention ×3 + deepseek_sparse_attention (索引 3)
#   mlp_layer_types[0:4]  = dense ×3 + sparse (first_k_dense_replace = 3 なので、4 番目が MoE)
#   indexer_types[0:4]    = full ×4
#   linear_attn_config    = kda_layers [0,1,2] / full_attn_layers [3] (元の値から、
#                           4 層に入る索引だけを残す。残さないと、無い層を指してしまう)
# これで、線形アテンション 3 層、sparse MLA 1 層、MoE 1 層を含み、**アテンションの形
# (qk_rope_head_dim = 0、kv_lora_rank = 512、index_topk = 2048、index_kpool = 4 など) を
# 1 つも上書きしない**。vLLM は、値が辞書の上書きを、入れ子の設定に再帰的に混ぜるので
# (`config/model.py` の `_apply_dict_overrides` / `_update_nested`)、text_config のほかの
# 項目は元のまま残る
value = '{"text_config":{"num_hidden_layers":4,"layer_types":["linear_attention","linear_attention","linear_attention","deepseek_sparse_attention"],"mlp_layer_types":["dense","dense","dense","sparse"],"indexer_types":["full","full","full","full"],"linear_attn_config":{"kda_layers":[0,1,2],"full_attn_layers":[3]}}}'
why = "モデルの設定のファイル (config.json) の層の並びの先頭 4 層をそのまま渡し、アテンションの形を変えずに小さいモデルにする。線形アテンション、sparse MLA、MoE の層を、それぞれ 1 つ以上含む"
source = "https://github.com/vllm-project/vllm/blob/385dce36bcee42309924a5ece951a96db3dce7f2/vllm/config/model.py"
quote = "If a dictionary, contains arguments to be forwarded to the Hugging Face config. If a callable, it is called to update the HuggingFace config."

[configs.probe-nightly.args.max-model-len]
flag = "--max-model-len"
value = "4096"
why = "段 0 が送るのは短い要求 1 つだけ (requirements 5.4) なので、入力の長さの上限を小さくして、KV と線形アテンションの状態のぶんを最小にする"
source = "https://github.com/vllm-project/vllm/blob/385dce36bcee42309924a5ece951a96db3dce7f2/vllm/config/model.py"
quote = "Model context length (prompt and output). If unspecified, will be automatically derived from the model config. …"

[configs.probe-nightly.args.max-num-seqs]
flag = "--max-num-seqs"
value = "1"
why = "同時に 1 本しか送らない。既定 (デバイスのメモリから決まる大きな値) のままだと、線形アテンションの状態が同時の本数に比例して、確かめたい失敗の前にメモリで落ちる"
source = "https://github.com/vllm-project/vllm/blob/385dce36bcee42309924a5ece951a96db3dce7f2/vllm/config/scheduler.py"
quote = "Maximum number of sequences to be processed in a single iteration. …"

[configs.probe-nightly.args.gpu-memory-utilization]
flag = "--gpu-memory-utilization"
value = "0.30"
why = "GB10 はユニファイドメモリなので、空きの見積もりが psutil の available になる (上の原文)。要る量は「全体 × この割合」で、それが空きを上回ると起動しない (`vllm/v1/worker/utils.py` の requested_memory。同じ commit)。段 0 で見たいのはアテンションの部品の可否なので、要求を小さくして、メモリの都合で落ちる筋道 (判定できなかった) を避ける"
source = "https://github.com/vllm-project/vllm/blob/385dce36bcee42309924a5ece951a96db3dce7f2/vllm/utils/mem_utils.py"
quote = "On UMA (Unified Memory Architecture) platforms where CPU and GPU share physical memory (e.g. GH200, DGX Spark, Jetson Orin), cudaMemGetInfo underreports free memory because it does not account for reclaimable OS memory (page cache, buffers). Use psutil to get the true available memory."

[configs.probe-nightly.args.language-model-only]
flag = "--language-model-only"
why = "このモデルは画像と動画も受ける形 (Glm5NextForConditionalGeneration) だが、この用途は文章だけである。マルチモーダルの下ごしらえのぶんのメモリを使わない"
source = "https://github.com/vllm-project/vllm/blob/385dce36bcee42309924a5ece951a96db3dce7f2/vllm/config/multimodal.py"
quote = "If True, disables all multimodal inputs by setting all modality limits to 0. Equivalent to setting `--limit-mm-per-prompt` to 0 for every modality."

# --- 環境変数 --------------------------------------------------------------

[configs.probe-nightly.env.logging-level]
