why = "/v1/models の id を、/ を含まない 1 つの名前にする (requirements 6.2)。別名を複数渡さないのは、/v1/messages が最初の別名だけを返して、直前の thinking が捨てられる報告があるため"
source = "https://github.com/vllm-project/vllm/blob/385dce36bcee42309924a5ece951a96db3dce7f2/vllm/config/model.py"
quote = "The model name(s) used in the API. If multiple names are provided, the server will respond to any of the provided names. The model name in the model field of a response will be the first name in this list. …"

[configs.p1-nvfp4-tp2.args.host]
flag = "--host"
value = "{head.lan_addr}"
why = "LAN のアドレスだけで待ち受ける (直結の側やほかのインターフェースで待ち受けない)。Mac からはこのアドレスで呼ぶ (requirements 6.1)"
source = "https://github.com/vllm-project/vllm/blob/385dce36bcee42309924a5ece951a96db3dce7f2/vllm/entrypoints/launchers/cli_args.py"
quote = "Host name."

[configs.p1-nvfp4-tp2.args.port]
flag = "--port"
value = "8000"
