# 要る (`netcheck.py` が、無い構成を Spark に触る前に断る)。

[configs.netcheck-bandwidth]
kind = "job"
description = "2 台の間の all-reduce の帯域を、イメージの中の torchrun で測る"
nodes = ["head", "worker"]
# 1 MiB から 1 GiB まで 6 つの大きさを、温め 5 回 + 計測 20 回。CUDA の初期化を含めて余裕を見る
ready_timeout_s = 1800

[configs.netcheck-bandwidth.image]
ref = "vllm/vllm-openai@sha256:b0501f99fec5136f248f78d5850977a2ec32d55cd9a665f4a9ffef24cbdf7fe5"
seen_as = "vllm/vllm-openai:glm53-flash-arm64-cu130"
size_bytes = 9666567584
source = "https://hub.docker.com/v2/repositories/vllm/vllm-openai/tags"
quote = "glm53-flash-arm64-cu130 / linux/arm64 / 9666567584 B / 2026-09-09T13:31:25Z"

[configs.netcheck-bandwidth.docker.gpus]
flag = "--gpus"
value = "all"
why = "all-reduce の対象のメモリを GPU に置く"
source = "https://docs.docker.com/reference/cli/docker/container/run/"
quote = "GPU devices to add to the container ('all' to pass all GPUs)"

[configs.netcheck-bandwidth.docker.ipc]
flag = "--ipc"
value = "host"
why = "PyTorch の分散がプロセスの間で共有メモリを使う。コンテナの既定の /dev/shm では足りない"
source = "https://docs.vllm.ai/en/latest/deployment/docker/"
quote = "You can either use the `ipc=host` flag or `--shm-size` flag to allow the container to access the host's shared memory. vLLM uses PyTorch, which uses shared memory to share data between processes under the hood, particularly for tensor parallel inference."

[configs.netcheck-bandwidth.docker.shm-size]
flag = "--shm-size"
value = "16g"
why = "/dev/shm の大きさを明示する。NVIDIA が、NCCL をコンテナの中で使うときに広げるよう求めている"
source = "https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/troubleshooting/runtime_and_mpi_issues.html"
quote = "In particular, Docker containers default to limited shared and pinned memory resources. When using NCCL inside a container, please make sure to adjust the shared memory size inside the container, for example by adding the following arguments to the docker launch command line: `--shm-size=1g --ulimit memlock=-1`"

[configs.netcheck-bandwidth.docker.ulimit-memlock]
flag = "--ulimit"
value = "memlock=-1"
why = "NCCL をコンテナの中で使うときに、NVIDIA がこの指定を求めている。コンテナは、共有メモリとピン留めのメモリの資源が既定で絞られていて、RoCE のメモリの登録はピン留めのメモリを使う"
source = "https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/troubleshooting/runtime_and_mpi_issues.html"
quote = "In particular, Docker containers default to limited shared and pinned memory resources. When using NCCL inside a container, please make sure to adjust the shared memory size inside the container, for example by adding the following arguments to the docker launch command line: `--shm-size=1g --ulimit memlock=-1`"

[configs.netcheck-bandwidth.docker.network]
flag = "--network"
value = "host"
why = "2 台をまたぐ rendezvous と NCCL が、ホストの直結のインターフェースをそのまま使う"
source = "https://docs.docker.com/engine/network/drivers/host/"
quote = "If you use the host network mode for a container, that container's network stack isn't isolated from the Docker host (the container shares the host's networking namespace), and the container doesn't get its own IP-address allocated. …"

[configs.netcheck-bandwidth.docker.entrypoint]
flag = "--entrypoint"
value = "torchrun"
why = "イメージの既定は vllm serve なので、2 台で同じスクリプトを起こす道具に差し替える。イメージには PyTorch と NCCL が入っているので、Spark に何も入れずに済む"
source = "https://docs.docker.com/reference/cli/docker/container/run/"
quote = "Overwrite the default ENTRYPOINT of the image"

[configs.netcheck-bandwidth.docker.mount-payload]
flag = "--mount"
value = "type=bind,source={remote_root}/payload,target=/payload,readonly"
why = "配った計測のスクリプトを、書き換えない形で見せる (serve push が payload/ に配る)"
source = "https://docs.docker.com/engine/storage/bind-mounts/"
quote = "If present, causes the bind mount to be mounted into the container as read-only."

[configs.netcheck-bandwidth.docker.mount-logs]
flag = "--mount"
value = "type=bind,source={remote_root}/logs,target=/logs"
why = "NCCL の記録を、コンテナが消えても残る場所に書く。合否をこの記録の経路から出すので、**読み取り専用にしない** (読み取り専用だと netcheck が起こす前に断る)"
source = "https://docs.docker.com/reference/cli/docker/container/run/"
quote = "Attach a filesystem mount to the container"

[configs.netcheck-bandwidth.args.nnodes]
flag = "--nnodes"
value = "2"
why = "2 台で 1 つの集団通信を作る"
source = "https://github.com/pytorch/pytorch/blob/v2.13.0/torch/distributed/run.py"
quote = "Number of nodes, or the range of nodes in form <minimum_nodes>:<maximum_nodes>."

[configs.netcheck-bandwidth.args.nproc-per-node]
flag = "--nproc-per-node"
value = "1"
why = "1 台に GPU が 1 基なので、1 台 1 プロセスにする (world size は 2 になる)"
source = "https://github.com/pytorch/pytorch/blob/v2.13.0/torch/distributed/run.py"
quote = "Number of workers per node; supported values: [auto, cpu, gpu, xpu, int]."

[configs.netcheck-bandwidth.args.rdzv-backend]
flag = "--rdzv-backend"
value = "static"
why = "c10d の rendezvous は、複数のノードで名前の解決に失敗することがある。静的な rendezvous にすると、--master-addr と --master-port がそのまま使われる"
source = "https://docs.vllm.ai/en/latest/usage/troubleshooting/"
quote = "We use `--rdzv_backend=static` instead of `c10d` because the `c10d` rendezvous backend can fail with DNS resolution errors in multi-node setups …"

[configs.netcheck-bandwidth.args.node-rank]
flag = "--node-rank"
value = "{node.rank}"
why = "構成の nodes に書いた順 (head が 0、worker が 1) を、そのまま順位にする。rank 0 の標準出力の JSON が、帯域の結果である"
source = "https://github.com/pytorch/pytorch/blob/v2.13.0/torch/distributed/run.py"
quote = "Rank of the node for multi-node distributed training. It is only used for static rendezvous (i.e., when ``--rdzv-backend=static``)."

[configs.netcheck-bandwidth.args.master-addr]
flag = "--master-addr"
value = "{head.fabric_addr}"
why = "rendezvous の宛先を、2 台の両方で head の直結の側のアドレスにする"
source = "https://github.com/pytorch/pytorch/blob/v2.13.0/torch/distributed/run.py"
quote = "Address of the master node (rank 0) that only used for static rendezvous. It should be either the IP address or the hostname of rank 0. …"

[configs.netcheck-bandwidth.args.master-port]
flag = "--master-port"
value = "29520"
is_port = true
why = "rendezvous の口を明示する。**推論サーバーの --master-port (29501) とも、torchrun の既定 (29500) とも別の番号**にして、どちらが上がっていても衝突しない。is_port を付けて、起動の前に空いているかを見る"
source = "https://github.com/pytorch/pytorch/blob/v2.13.0/torch/distributed/run.py"
quote = "Port on the master node (rank 0) to be used for communication during distributed training. It is only used for static rendezvous. Defaults to 29500."

[configs.netcheck-bandwidth.args.script]
value = "/payload/allreduce_bench.py"
why = "torchrun の位置の引数は、2 台で動かすスクリプトである。自前の all-reduce の計測で、大きさごとの busbw を 1 行の JSON で出す"
source = "https://github.com/pytorch/pytorch/blob/v2.13.0/torch/distributed/run.py"
quote = "Full path to the (single GPU) training program/script to be launched in parallel, followed by all the arguments for the training script."

[configs.netcheck-bandwidth.env.nccl-socket-ifname]
flag = "NCCL_SOCKET_IFNAME"
value = "={node.fabric_ifname}"
why = "NCCL のブートストラップと制御の経路を、直結のインターフェースに固定する。= を付けて名前の完全一致にする"
source = "https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/env.html"
quote = "Define to a list of prefixes to filter interfaces to be used by NCCL. Multiple prefixes can be provided, separated by the , symbol. Using the ^ symbol, NCCL will exclude interfaces starting with any prefix in that list. To match (or not) an exact interface name, begin the prefix string with the = character. …"

[configs.netcheck-bandwidth.env.gloo-socket-ifname]
flag = "GLOO_SOCKET_IFNAME"
value = "{node.fabric_ifname}"
why = "静的な rendezvous と CPU の側の集団通信が使う Gloo の経路も、同じ直結のインターフェースに固定する"
source = "https://docs.pytorch.org/docs/stable/distributed.html"
quote = "By default, both the NCCL and Gloo backends will try to find the right network interface to use. If the automatically detected interface is not correct, you can override it using the following environment variables (applicable to the respective backend) …"

[configs.netcheck-bandwidth.env.nccl-debug]
flag = "NCCL_DEBUG"
value = "INFO"
why = "経路の確定の行 (Using network …) は INFO の段でしか出ない。合否をこの行から出すので、確認のときは INFO にする (定常の運転では付けない)"
source = "https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/env.html"
quote = "The NCCL_DEBUG variable controls the debug information that is displayed from NCCL. This variable is commonly used for debugging."

[configs.netcheck-bandwidth.env.nccl-debug-subsys]
flag = "NCCL_DEBUG_SUBSYS"
value = "INIT,BOOTSTRAP,ENV,NET,GRAPH"
why = "既定では NET と GRAPH が出ないので、HCA の詳細と、1 本のケーブルの 2 つの口を 1 つの論理 NIC に束ねた証拠が読めない"
source = "https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/env.html"
quote = "The default value is INIT,BOOTSTRAP,ENV. Supported subsystem names are INIT (stands for initialization), COLL (stands for collectives), P2P (stands for peer-to-peer), SHM (stands for shared memory), NET (stands for network), GRAPH (stands for topology detection and graph search) …"

[configs.netcheck-bandwidth.env.nccl-debug-file]
flag = "NCCL_DEBUG_FILE"
# 置き場所 (/logs) が、logs/ の --mount の target の下にあることが要る。ファイルの名前の
# 部分は、`netcheck.py` が回ごとに上書きする (前の回の記録で今回の失敗を隠さないため)
value = "/logs/nccl_%h_%p.log"
why = "2 台ぶんの記録を、取りこぼさずに回収する。標準出力に混ぜると、帯域の結果の JSON と混ざる"
source = "https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/env.html"
quote = "The NCCL_DEBUG_FILE variable directs the NCCL debug logging output to a file. The filename format can be set to filename.%h.%p where %h is replaced with the hostname and %p is replaced with the process PID. …"


