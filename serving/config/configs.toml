why = "HTTP の口を 1 つだけ開く。既存の対象サーバー (8001) と重ならない番号にする"
source = "https://github.com/vllm-project/vllm/blob/385dce36bcee42309924a5ece951a96db3dce7f2/vllm/entrypoints/launchers/cli_args.py"
quote = "Port number."

[configs.p1-nvfp4-tp2.args.tensor-parallel-size]
flag = "--tensor-parallel-size"
value = "2"
why = "2 台 × 1 基の GPU で、1 つのモデルを 2 つに分ける (requirements 6。2 台の両方で同じ値にする)"
source = "https://github.com/vllm-project/vllm/blob/385dce36bcee42309924a5ece951a96db3dce7f2/vllm/config/parallel.py"
quote = "Number of tensor parallel groups."

[configs.p1-nvfp4-tp2.args.nnodes]
flag = "--nnodes"
value = "2"
why = "2 台にまたがる 1 つのサーバーにする。CUDA で nnodes > 1 なら、実行の後ろ側は自動で mp になるので、--distributed-executor-backend は書かない"
