# 構成の定義 (design.md Data Models、requirements 3.1、3.2、3.6、11.1〜11.5)。
#
# `[configs.<名前>]` が 1 つの構成で、`<名前>` はテーブルの鍵から取る。計測者は
# `serve <コマンド> <名前>` で 1 つを選ぶ。
#
# **設定の 1 つ 1 つが、値と、なぜ (`why`) と、根拠を持つ。** 根拠の書き方は 2 通りだけで、
# どちらか一方が必ず要る (`config.py` の検査 1 が、欠けていれば起動を断る):
#
#   source + quote : 道具の一次の資料の URL と、その原文の抜粋 (要約しない)
#   measured       : 自分たちの実測の記録の場所 (`docs/` の下の、実在するファイル)
#
# 出典の選び方 (requirements 11.2): **公式の手引きのコマンドを写さず、道具の一次の資料
# (CLI の引数の説明、環境変数の説明、設定の項目の説明) を引く**。vLLM の引数は、固定した
# イメージの build commit (`385dce36bcee42309924a5ece951a96db3dce7f2`。research.md §a-2) の
# ソースの、その項目の説明を引いている。第三者のレシピ、ブログ、フォーラム、モデルカードは
# 開いていない (requirements 11.3)。
#
# 段と構成の名前の対応 (design.md 「Baseline Procedure」):
#   段 0 = probe-pinned        1 台の縮小の確認 (重みを落とさない)
#   段 1 = probe-nightly       より新しい上流の公式のイメージ (nightly) での、同じ確認
#   段 2 = p1-nvfp4-tp2        2 台 TP=2 の推論サーバー (第一の構成)
#   glm53-tp2-mtp3-marlin      45 tok/s に届いた構成 (k2s4 + MTP N=3 + --moe-backend marlin。issue #103)
# 段より前に流すもの:
#   p1-fetch-nvfp4-probe       段 0 に要る設定とトークナイザだけを取得する
#   p1-fetch-nvfp4             重みの本体を 2 台に取得する
#   p1-image-licenses          イメージの中のライセンスの表記を読む
#   netcheck-bandwidth         2 台の間の帯域を測る (`serve netcheck bandwidth`)
#   netcheck-bandwidth-ib      同上 + --device /dev/infiniband (回 1 の実測を根拠に足した A/B の B)
#   netcheck-sanity            2 台での事前の 4 段の確認 (`serve netcheck sanity`)
#
# 入れていないもの (design.md 「最初は入れない」。実測の根拠 (`measured`) ができてから足す):
#   --cap-add SYS_NICE、--cap-add IPC_LOCK (--device /dev/infiniband は 2026-09-22 の A/B で採用した)、--kv-cache-dtype、
#   --block-size、--enforce-eager、
#   --distributed-executor-backend (CUDA で nnodes > 1 なら自動で mp になる)、
#   NCCL_IB_HCA、NCCL_IB_MERGE_NICS、NCCL_IB_GID_INDEX (どれも既定のまま)。
#   --moe-backend と投機的デコードの 4 つの指定は、`glm53-tp2-mtp3-marlin` (allow_speculative = true)
#   だけが持つ (2026-09-28 の確認の段の実測を根拠に採用。ほかの構成には入れていない)
#
# 入れていないもの (根拠に辿れないため。親の判断、2026-09-22):
#   --ulimit stack=67108864 — design.md の最初の構成の表は挙げているが、64 MiB という値の
#   唯一の出どころが NVIDIA の NGC の手引きの**コマンド**で、requirements 11.2 が「公式の
#   手引きのコマンドを写さない」と定めている形に当たる。NCCL の一次の資料が述べているのは
#   「上限を無制限にすると落ちる事例がある」だけで、コンテナの既定はもともと有限なので、
#   この指定は上げる側になる。要るとわかったら、実測の根拠 (`measured`) を付けて足す。
#   --ulimit memlock=-1 のほうは、NCCL の文書が理由まで述べているので残してある
#
# 道具が必ず付ける引数 (`-d`、`--pull never`、`--name`、`--label`、`--restart no`、
# `-e`) は、ここに書くと二重になるので `plan.py` が断る。

schema_version = 1


# ===========================================================================
# 段 0: probe-pinned — 1 台の縮小の確認 (requirements 5.1〜5.5)
# ===========================================================================
#
# 重みを 1 バイトも落とさずに、固定したイメージで、同じアテンションの経路を踏む。
# `--load-format dummy` で重みを乱数にし、`--hf-overrides` で層の数を 45 から 4 に
# 減らす。設定とトークナイザ (約 37 MiB) だけは実物を読むので、`probe/<slug>/` を
# 読み取り専用で結び付ける。

[configs.probe-pinned]
kind = "probe"
description = "段 0。固定したイメージで、重みを落とさずに 1 台で起動できるかを見る"
nodes = ["head"]
# 重みの読み込みがなく、層が 4 つなので、時間を食うのは CUDA の初期化と JIT だけである。
# vLLM の `VLLM_DEEP_GEMM_WARMUP` の説明が、この温めが起動を「数分」伸ばすと書いている
# (`vllm/envs.py`: "However, this warmup increases the engine startup time by a couple of
# minutes.")。その数分の 5 倍ほどを上限にする。足りなければ `serve probe --timeout` で、
# その回だけ延ばせる (design.md 「cli」)
ready_timeout_s = 600
served_model_name = "glm-5-3-flash"

[configs.probe-pinned.image]
ref = "vllm/vllm-openai@sha256:b0501f99fec5136f248f78d5850977a2ec32d55cd9a665f4a9ffef24cbdf7fe5"
