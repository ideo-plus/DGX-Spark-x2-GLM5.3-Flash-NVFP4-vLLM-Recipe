source = "https://docs.vllm.ai/en/latest/deployment/docker/"
quote = "You can either use the `ipc=host` flag or `--shm-size` flag to allow the container to access the host's shared memory. vLLM uses PyTorch, which uses shared memory to share data between processes under the hood, particularly for tensor parallel inference."

[configs.glm53-tp2-mtp3-marlin.docker.shm-size]
flag = "--shm-size"
value = "16g"
why = "/dev/shm の大きさを明示する。NVIDIA が、NCCL をコンテナの中で使うときに広げるよう求めている (--ipc host と重なる指定で、vLLM の文書はどちらか一方でよいと書いている)"
source = "https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/troubleshooting/runtime_and_mpi_issues.html"
quote = "In particular, Docker containers default to limited shared and pinned memory resources. When using NCCL inside a container, please make sure to adjust the shared memory size inside the container, for example by adding the following arguments to the docker launch command line: `--shm-size=1g --ulimit memlock=-1`"

[configs.glm53-tp2-mtp3-marlin.docker.ulimit-memlock]
flag = "--ulimit"
value = "memlock=-1"
why = "NCCL をコンテナの中で使うときに、NVIDIA がこの指定を求めている。コンテナは、共有メモリとピン留めのメモリの資源が既定で絞られていて、RoCE のメモリの登録はピン留めのメモリを使う"
source = "https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/troubleshooting/runtime_and_mpi_issues.html"
quote = "In particular, Docker containers default to limited shared and pinned memory resources. When using NCCL inside a container, please make sure to adjust the shared memory size inside the container, for example by adding the following arguments to the docker launch command line: `--shm-size=1g --ulimit memlock=-1`"

[configs.glm53-tp2-mtp3-marlin.docker.network]
flag = "--network"
value = "host"
why = "2 台をまたぐ torch.distributed と NCCL が、ホストの直結のインターフェースをそのまま使う。-p が効かないので、--port で直接開く"
source = "https://docs.docker.com/engine/network/drivers/host/"
quote = "If you use the host network mode for a container, that container's network stack isn't isolated from the Docker host (the container shares the host's networking namespace), and the container doesn't get its own IP-address allocated. …"

[configs.glm53-tp2-mtp3-marlin.docker.mount-weights]
flag = "--mount"
value = "type=bind,source={remote_root}/models/k2s4,target=/models/k2s4,readonly"
why = "手元で変換した重みを、書き換えない形で見せる (固定したマニフェストと、ファイルごとの SHA-256 を守る。requirements 3.4)"
source = "https://docs.docker.com/engine/storage/bind-mounts/"
quote = "If present, causes the bind mount to be mounted into the container as read-only."

[configs.glm53-tp2-mtp3-marlin.docker.mount-cache]
flag = "--mount"
value = "type=bind,source={remote_root}/cache,target=/root/.cache"
why = "JIT とコンパイルの結果を、起こし直しても作り直さない (要件 1.4 の「決めた時間のうちに受け付けられる状態になる」に効く)。/root/.cache は、vLLM のキャッシュ (~/.cache/vllm) の親である"
source = "https://docs.vllm.ai/en/latest/deployment/docker/"
quote = "Mounting the Hugging Face cache keeps model weights across containers, but each new container still starts with an empty `VLLM_CACHE_ROOT` (default `~/.cache/vllm`) and recompiles the model's `torch.compile` artifacts. …"

[configs.glm53-tp2-mtp3-marlin.docker.mount-logs]
flag = "--mount"
value = "type=bind,source={remote_root}/logs,target=/logs"
why = "通信の記録を、コンテナが消えても残る場所に書けるようにする (serve logs が回収する)。読み取り専用にしない"
source = "https://docs.docker.com/reference/cli/docker/container/run/"
quote = "Attach a filesystem mount to the container"

[configs.glm53-tp2-mtp3-marlin.docker.mount-vllm-overlay-model-executor-layers-vocab-parallel-embedding-py]
flag = "--mount"
value = "type=bind,source={remote_root}/payload/vllm-overlay/k2s2b/vllm/model_executor/layers/vocab_parallel_embedding.py,target=/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/vocab_parallel_embedding.py,readonly"
why = "ADR 0007 の第 2b 段 (#79)。固定した vLLM (0961bbae) のこのファイルに experiments/k2-vllm-overlay のパッチを当てた写し (serving/payload/vllm-overlay/<名前>/…。serve push で配る) を、イメージを作り直さずに読み取り専用の bind mount で重ねる。重ねる先は、イメージの中の vLLM の導入先 (uv pip install --system が置く dist-packages) の同じ道筋"
source = "https://github.com/vllm-project/vllm/blob/0961bbae2894d574be790d219651824eb199318e/docker/Dockerfile"
quote = "ARG PYTHON_VERSION=3.12 … uv pip install --system dist/*.whl --verbose … \"/usr/local/lib/python${PYTHON_VERSION}/dist-packages/nvpl/lib\""

[configs.glm53-tp2-mtp3-marlin.docker.mount-vllm-overlay-models-glm5next-common-model-py]
flag = "--mount"
value = "type=bind,source={remote_root}/payload/vllm-overlay/k2s2b/vllm/models/glm5next/common/model.py,target=/usr/local/lib/python3.12/dist-packages/vllm/models/glm5next/common/model.py,readonly"
why = "ADR 0007 の第 2b 段 (#79)。固定した vLLM (0961bbae) のこのファイルに experiments/k2-vllm-overlay のパッチを当てた写し (serving/payload/vllm-overlay/<名前>/…。serve push で配る) を、イメージを作り直さずに読み取り専用の bind mount で重ねる。重ねる先は、イメージの中の vLLM の導入先 (uv pip install --system が置く dist-packages) の同じ道筋"
source = "https://github.com/vllm-project/vllm/blob/0961bbae2894d574be790d219651824eb199318e/docker/Dockerfile"
quote = "ARG PYTHON_VERSION=3.12 … uv pip install --system dist/*.whl --verbose … \"/usr/local/lib/python${PYTHON_VERSION}/dist-packages/nvpl/lib\""

[configs.glm53-tp2-mtp3-marlin.docker.mount-vllm-overlay-models-glm5next-common-kda-py]
flag = "--mount"
value = "type=bind,source={remote_root}/payload/vllm-overlay/k2s2b/vllm/models/glm5next/common/kda.py,target=/usr/local/lib/python3.12/dist-packages/vllm/models/glm5next/common/kda.py,readonly"
why = "ADR 0007 の第 2b 段 (#79)。固定した vLLM (0961bbae) のこのファイルに experiments/k2-vllm-overlay のパッチを当てた写し (serving/payload/vllm-overlay/<名前>/…。serve push で配る) を、イメージを作り直さずに読み取り専用の bind mount で重ねる。重ねる先は、イメージの中の vLLM の導入先 (uv pip install --system が置く dist-packages) の同じ道筋"
source = "https://github.com/vllm-project/vllm/blob/0961bbae2894d574be790d219651824eb199318e/docker/Dockerfile"
quote = "ARG PYTHON_VERSION=3.12 … uv pip install --system dist/*.whl --verbose … \"/usr/local/lib/python${PYTHON_VERSION}/dist-packages/nvpl/lib\""

# --- vllm serve の引数 (この順で並ぶ) --------------------------------------

[configs.glm53-tp2-mtp3-marlin.docker.device-infiniband]
flag = "--device"
value = "/dev/infiniband"
why = "コンテナの中から RDMA のデバイスが見えないと、NCCL が `NET/IB : No device found.` で TCP (Socket、16 Gbps) に落ちる。ホストの /dev/infiniband を渡すと、NCCL が IB (RoCE) の経路を選び、1 GiB の all-reduce の busbw が 186.9 Gbps になった (2026-09-22 の A/B。回 1 → 回 2 で 11.7 倍)"
measured = "docs/results/2026-09-22-netcheck-bandwidth.md"

[configs.glm53-tp2-mtp3-marlin.args.model-path]
value = "{weights.mount_at}"
why = "vllm serve の第一の位置の引数が、モデルの場所である"
source = "https://github.com/vllm-project/vllm/blob/385dce36bcee42309924a5ece951a96db3dce7f2/vllm/entrypoints/cli/serve.py"
quote = "usage=\"vllm serve [model_tag] [options]\""

[configs.glm53-tp2-mtp3-marlin.args.served-model-name]
flag = "--served-model-name"
value = "glm-5-3-flash"
why = "/v1/models の id を、/ を含まない 1 つの名前にする (requirements 6.2)。別名を複数渡さないのは、/v1/messages が最初の別名だけを返して、直前の thinking が捨てられる報告があるため"
source = "https://github.com/vllm-project/vllm/blob/385dce36bcee42309924a5ece951a96db3dce7f2/vllm/config/model.py"
quote = "The model name(s) used in the API. If multiple names are provided, the server will respond to any of the provided names. The model name in the model field of a response will be the first name in this list. …"

[configs.glm53-tp2-mtp3-marlin.args.host]
flag = "--host"
value = "{head.lan_addr}"
why = "LAN のアドレスだけで待ち受ける (直結の側やほかのインターフェースで待ち受けない)。Mac からはこのアドレスで呼ぶ (requirements 6.1)"
source = "https://github.com/vllm-project/vllm/blob/385dce36bcee42309924a5ece951a96db3dce7f2/vllm/entrypoints/launchers/cli_args.py"
quote = "Host name."

[configs.glm53-tp2-mtp3-marlin.args.port]
flag = "--port"
value = "8000"
is_port = true
why = "HTTP の口を 1 つだけ開く。既存の対象サーバー (8001) と重ならない番号にする"
source = "https://github.com/vllm-project/vllm/blob/385dce36bcee42309924a5ece951a96db3dce7f2/vllm/entrypoints/launchers/cli_args.py"
quote = "Port number."

[configs.glm53-tp2-mtp3-marlin.args.tensor-parallel-size]
flag = "--tensor-parallel-size"
value = "2"
why = "2 台 × 1 基の GPU で、1 つのモデルを 2 つに分ける (requirements 6。2 台の両方で同じ値にする)"
source = "https://github.com/vllm-project/vllm/blob/385dce36bcee42309924a5ece951a96db3dce7f2/vllm/config/parallel.py"
quote = "Number of tensor parallel groups."

[configs.glm53-tp2-mtp3-marlin.args.nnodes]
flag = "--nnodes"
value = "2"
why = "2 台にまたがる 1 つのサーバーにする。CUDA で nnodes > 1 なら、実行の後ろ側は自動で mp になるので、--distributed-executor-backend は書かない"
source = "https://github.com/vllm-project/vllm/blob/385dce36bcee42309924a5ece951a96db3dce7f2/vllm/config/parallel.py"
quote = "num of nodes for multi-node distributed inference when distributed_executor_backend is mp."

[configs.glm53-tp2-mtp3-marlin.args.node-rank]
flag = "--node-rank"
value = "{node.rank}"
why = "構成の nodes に書いた順 (head が 0、worker が 1) を、そのまま順位にする。既定に頼らず、2 台の両方で明示する"
source = "https://github.com/vllm-project/vllm/blob/385dce36bcee42309924a5ece951a96db3dce7f2/vllm/config/parallel.py"
quote = "distributed node rank for multi-node distributed inference when distributed_executor_backend is mp."

[configs.glm53-tp2-mtp3-marlin.args.headless]
flag = "--headless"
only_on = "worker"
why = "worker は HTTP の API を持たず、worker のプロセスだけを動かす。API を持つのは head の 1 台だけである"
source = "https://github.com/vllm-project/vllm/blob/385dce36bcee42309924a5ece951a96db3dce7f2/vllm/entrypoints/launchers/cli_args.py"
quote = "Run in headless mode. See multi-node data parallel documentation for more details."

[configs.glm53-tp2-mtp3-marlin.args.master-addr]
flag = "--master-addr"
value = "{head.fabric_addr}"
why = "分散の初期化の宛先を、2 台の両方で head の直結の側のアドレスにする。既定は 127.0.0.1 なので、2 台では必ず上書きが要る"
source = "https://github.com/vllm-project/vllm/blob/385dce36bcee42309924a5ece951a96db3dce7f2/vllm/config/parallel.py"
quote = "distributed master address for multi-node distributed inference when distributed_executor_backend is mp."

[configs.glm53-tp2-mtp3-marlin.args.master-port]
flag = "--master-port"
value = "29501"
is_port = true
why = "分散の初期化の口を明示する (既定と同じ値を、あとから既定が変わっても動くように書く)。通信の確認のジョブの rendezvous とは別の番号にして、両方が同時に上がっても衝突しない"
source = "https://github.com/vllm-project/vllm/blob/385dce36bcee42309924a5ece951a96db3dce7f2/vllm/config/parallel.py"
quote = "distributed master port for multi-node distributed inference when distributed_executor_backend is mp."

[configs.glm53-tp2-mtp3-marlin.args.max-model-len]
flag = "--max-model-len"
value = "163840"
why = "bench の prefill が 128k トークン、agent が 12 万トークンまで伸びる。入力 128k と出力の余裕を見て 160k にする (モデルの上限は 1,048,576 なので余裕がある)"
source = "https://github.com/vllm-project/vllm/blob/385dce36bcee42309924a5ece951a96db3dce7f2/vllm/config/model.py"
quote = "Model context length (prompt and output). If unspecified, will be automatically derived from the model config. …"

[configs.glm53-tp2-mtp3-marlin.args.max-num-seqs]
flag = "--max-num-seqs"
value = "16"
why = "線形アテンションの状態が同時の本数に比例し、1 本あたり 1 台で約 70 MiB を取る。既定 (デバイスのメモリから決まる大きな値) のままだと数十 GiB を失う。bench の同時 8 本まで足りる"
source = "https://github.com/vllm-project/vllm/blob/385dce36bcee42309924a5ece951a96db3dce7f2/vllm/config/scheduler.py"
quote = "Maximum number of sequences to be processed in a single iteration. …"

[configs.glm53-tp2-mtp3-marlin.args.max-num-batched-tokens]
flag = "--max-num-batched-tokens"
value = "8192"
why = "チャンク化した prefill の 1 回ぶん。4096 から 8192 に増やすと、入力の処理が速くなる。env の VLLM_SPARSE_INDEXER_MAX_LOGITS_MB=256 と組で使う。2026-10-01 の実機の計測 (KV を 1 台あたり 4 GiB に固定し、8192 と上限 256 MB を組にした構成。起動の前に 2 台のページキャッシュを捨て、bench の fast の入力の処理を各 5 回) で、cold 32k が 1,614 tok/s (1,604〜1,616。4096 は 1,448)、cold 64k が 1,596 tok/s (4096 は 1,461)、cold 128k が 1,576 tok/s (1,565〜1,577。4096 は 1,429) だった。先に行った探り (各 3 回) でも cold 128k は 1,576 tok/s で、128k の後の cold 32k も 1,612 tok/s で落ちなかった。sparkDash の prefill は 32k が 1,669 tok/s、128k が 1,663 tok/s (4096 では 1,637、1,614)。NV_ERR_NO_MEMORY は 2 回の起動で 2 台とも 0 件、preemption は 0 回、head の MemFree は最小で 5.4 GiB だった。8192 だけでは、128k の入力で indexer の logits の小分けが 2 回になってピークが約 1 GiB になり、cold 128k が 1,141 tok/s に落ち、head で NV_ERR_NO_MEMORY が出た (docs/results/2026-10-01-mbt-8192-128k.md)。記録は docs/results/2026-10-01-mbt-8192-logits-256.md (#169)"
source = "https://github.com/vllm-project/vllm/blob/385dce36bcee42309924a5ece951a96db3dce7f2/vllm/config/scheduler.py"
quote = "Maximum number of tokens that can be processed in a single iteration. …"

[configs.glm53-tp2-mtp3-marlin.args.gpu-memory-utilization]
flag = "--gpu-memory-utilization"
value = "0.90"
why = "GB10 はユニファイドメモリなので、空きの見積もりが psutil の available になる (上の原文)。要る量は「全体 × この割合」で、それが空きを上回ると起動しない (`vllm/v1/worker/utils.py` の requested_memory。同じ commit)。既定の 0.92 より控えめにして、OS の側に余裕を残す。--kv-cache-memory-bytes で KV の量を指定した後は、この値は起動の前の空きの検査 (`vllm/v1/worker/utils.py` の request_memory。空きが「全体 × この割合」より少ないと起動しない) にだけ効き、KV の量には使われない (https://github.com/vllm-project/vllm/blob/0961bbae2894d574be790d219651824eb199318e/vllm/v1/worker/utils.py)"
source = "https://github.com/vllm-project/vllm/blob/385dce36bcee42309924a5ece951a96db3dce7f2/vllm/utils/mem_utils.py"
quote = "On UMA (Unified Memory Architecture) platforms where CPU and GPU share physical memory (e.g. GH200, DGX Spark, Jetson Orin), cudaMemGetInfo underreports free memory because it does not account for reclaimable OS memory (page cache, buffers). Use psutil to get the true available memory."

[configs.glm53-tp2-mtp3-marlin.args.kv-cache-memory-bytes]
flag = "--kv-cache-memory-bytes"
value = "4294967296"
why = "既定の量 (KV 12.82 GiB、1,137,427 トークン) では、cold 128k の入力でエンジンが 10 分間止まり、head のカーネルの記録に NV_ERR_NO_MEMORY が出た (#135)。--kv-cache-memory-bytes 4294967296 (4 GiB) だけを足した一時構成では、cold 128k が 96.8 秒 (1,333 tok/s) で通り、cold 32k が 1,330〜1,335 tok/s にそろい、2 台とも NV_ERR_NO_MEMORY は 0 件だった。KV の容量は 352,886 トークン (163,840 トークンの要求 2.15 本分) で、agent の 12 万トークンの会話 1 本分が収まる。この指定があると、vLLM は起動後のメモリーの見積もりを飛ばし、KV の量に gpu_memory_utilization を使わない (docs/results/2026-09-30-fast-prefill-long-input.md)"
source = "https://github.com/vllm-project/vllm/blob/0961bbae2894d574be790d219651824eb199318e/vllm/config/cache.py"
quote = "Note that kv_cache_memory_bytes (when not-None) ignores gpu_memory_utilization"

[configs.glm53-tp2-mtp3-marlin.args.default-chat-template-kwargs]
flag = "--default-chat-template-kwargs"
value = '{"reasoning_effort":"low"}'
why = "既定の深さ (最大) では、コードの課題で答えが思考の中に書かれ、本文が空で終わる (#158。bench の fast の decode 60 本のうち 59 本が思考だけで終わり、/v1/messages の経路では 3 本中 0 本しか答えが出なかった)。この引数だけを足した一時構成では、decode の 60 本すべてで本文の答えまで届き、本文が出始めるまでは 0.6〜1.4 秒、quality は toolcall 10/10、humaneval+ 10/10、needle 2/2 で、既定の 7/10、10/10、2/2 と同じか上だった (記録は #158)。要求の側の chat_template_kwargs が優先されるので、深く考えさせたい要求は reasoning_effort を送れば変えられる"
source = "https://github.com/vllm-project/vllm/blob/0961bbae2894d574be790d219651824eb199318e/vllm/entrypoints/launchers/cli_args.py"
quote = "Default keyword arguments to pass to the chat template renderer. These will be merged with request-level chat_template_kwargs, with request values taking precedence."

[configs.glm53-tp2-mtp3-marlin.args.language-model-only]
flag = "--language-model-only"
why = "このモデルは画像と動画も受ける形だが、この用途は文章だけである。マルチモーダルの下ごしらえのぶんのメモリを使わない"
source = "https://github.com/vllm-project/vllm/blob/385dce36bcee42309924a5ece951a96db3dce7f2/vllm/config/multimodal.py"
quote = "If True, disables all multimodal inputs by setting all modality limits to 0. Equivalent to setting `--limit-mm-per-prompt` to 0 for every modality."

[configs.glm53-tp2-mtp3-marlin.args.no-enable-flashinfer-autotune]
flag = "--no-enable-flashinfer-autotune"
why = "この温めを走らせない。項目の既定は None (`enable_flashinfer_autotune: bool = None`) なので、走るかどうかが環境で変わる。起動の段を減らして、確かめたい失敗の前に別の原因で止まらないようにする (真偽の設定には --no- 付きの形ができる)。research.md §d-4 が、マルチノードの起動がこの段で止まるという上流の報告 (vLLM の issue #52291) を記録している (この構成を書いた作業者は、その issue を開いていない)"
source = "https://github.com/vllm-project/vllm/blob/385dce36bcee42309924a5ece951a96db3dce7f2/vllm/config/kernel.py"
quote = "If True, run FlashInfer autotuning during kernel warmup."

[configs.glm53-tp2-mtp3-marlin.args.tool-call-parser]
flag = "--tool-call-parser"
value = "glm47"
why = "ツール呼び出しの出力を、OpenAI 互換の形に読み替える。glm47 という名前は vllm/tool_parsers/__init__.py に登録されている (glm45 と同じ実装に写る。glm53 という名前はない)"
source = "https://github.com/vllm-project/vllm/blob/385dce36bcee42309924a5ece951a96db3dce7f2/vllm/entrypoints/launchers/cli_args.py"
quote = "Select the tool call parser depending on the model that you're using. This is used to parse the model-generated tool call into OpenAI API format. Required for `--enable-auto-tool-choice`. …"

[configs.glm53-tp2-mtp3-marlin.args.reasoning-parser]
flag = "--reasoning-parser"
value = "glm47"
why = "thinking の中身を、OpenAI 互換の形に読み替える。glm47 は vllm/reasoning/__init__.py に登録されている (glm45 と同じ実装に写る)"
source = "https://github.com/vllm-project/vllm/blob/385dce36bcee42309924a5ece951a96db3dce7f2/vllm/config/structured_outputs.py"
quote = "Select the reasoning parser depending on the model that you're using. This is used to parse the reasoning content into OpenAI API format."

[configs.glm53-tp2-mtp3-marlin.args.enable-auto-tool-choice]
flag = "--enable-auto-tool-choice"
why = "bench がツール呼び出しを測るのに、自動のツール選択が要る。--tool-call-parser と組で渡さないと、起動そのものが断られる"
source = "https://github.com/vllm-project/vllm/blob/385dce36bcee42309924a5ece951a96db3dce7f2/vllm/entrypoints/launchers/cli_args.py"
quote = "Enable auto tool choice for supported models. Use `--tool-call-parser` to specify which parser to use."

[configs.glm53-tp2-mtp3-marlin.args.enable-prompt-tokens-details]
flag = "--enable-prompt-tokens-details"
why = "これを付けないと、/v1/messages の cache_read_input_tokens に、キャッシュの内訳が出ない (requirements 9.1)"
source = "https://github.com/vllm-project/vllm/blob/385dce36bcee42309924a5ece951a96db3dce7f2/vllm/entrypoints/launchers/cli_args.py"
quote = "If set to True, enable prompt_tokens_details in usage."

[configs.glm53-tp2-mtp3-marlin.args.shutdown-timeout]
flag = "--shutdown-timeout"
value = "60"
why = "既定の 0 は、動いている要求をすぐ捨てる。bench の途中で止めたときに、記録が壊れないよう猶予を入れる"
source = "https://github.com/vllm-project/vllm/blob/385dce36bcee42309924a5ece951a96db3dce7f2/vllm/config/vllm.py"
quote = "Shutdown grace period for in-flight requests. Shutdown will be delayed for up to this amount of time to allow already-running requests to complete. Any remaining requests are aborted once the timeout is reached."

[configs.glm53-tp2-mtp3-marlin.args.speculative-config]
flag = "--speculative-config"
value = '{"method":"mtp","num_speculative_tokens":3}'
why = "ADR 0006 の K1。モデル付属の MTP (num_nextn_predict_layers = 1) を下書き 3 トークンで使う。n_predict = 1 なので、どの N も vLLM の割り切れる検査を通る。N >= 2 で文脈が 2048 を超えると kpool が壊れる報告 (vLLM #58454、未修正) があるので、手順書の確認を必ず行う"
source = "https://github.com/vllm-project/vllm/blob/0961bbae2894d574be790d219651824eb199318e/vllm/config/speculative.py"
quote = "The name of the speculative method to use. … The number of speculative tokens, if provided. It will default to the number in the draft model config if present, otherwise, it is required."

[configs.glm53-tp2-mtp3-marlin.args.load-format]
flag = "--load-format"
value = 'instanttensor'
why = "#50 (#37 の実測、2026-09-26)。--load-format instanttensor で、重みの読み込みが 363 秒 (head) から 32 秒に、起動全体が約 11 分から約 3 分になった。同じ構成の probe で、decode の tok/s (code/en 14.06、code/ja 13.99、prose/en 14.07、prose/ja 13.88) は既定の読み方 (14.13、14.01、14.12、13.98) と同じ範囲、toolcall は 5/5 で正解・不正解が投機なしの回と同じ、needle 8k は正解、壊れの印は 0 件。計測のたびに起動するので、full と full-mtp の既定にする。外すときは --load-format auto (出力は #50 より前の既定と同じ)"
source = "https://github.com/vllm-project/vllm/blob/0961bbae2894d574be790d219651824eb199318e/vllm/config/load.py"
quote = "\"instanttensor\" will load the Safetensors weights on CUDA devices using InstantTensor, which enables distributed loading with pipelined prefetching and fast direct I/O."

[configs.glm53-tp2-mtp3-marlin.args.moe-backend]
flag = "--moe-backend"
value = 'marlin'
why = "主の層の MoE も Marlin にし、k2s4 の MTP の層 (NVFP4A16 で Marlin) と実装をそろえる。decode では 1 回に流れるトークンが少ないので、重みだけ 4 bit で活性は BF16 のままの Marlin のほうが速い。確認の段 (fast、出力 256、N = 3) でコード・英語が k2s3 で 42.1 → 43.8 tok/s、k2s4 で 45.0 tok/s になり、壊れは見つからなかった (docs/results/2026-09-28-k2-stage3.md)"
source = "https://github.com/vllm-project/vllm/blob/0961bbae2894d574be790d219651824eb199318e/vllm/model_executor/layers/fused_moe/oracle/nvfp4.py"
quote = "\"marlin\": NvFp4MoeBackend.MARLIN,"

# --- 環境変数 (p1-nvfp4-tp2 の 3 つ + IB の確認のために起動のたびに付ける NCCL の記録の 3 つ + indexer の logits の上限) -----

[configs.glm53-tp2-mtp3-marlin.env.vllm-host-ip]
flag = "VLLM_HOST_IP"
value = "{node.fabric_addr}"
why = "ノードごとに、自分の直結の側のアドレスを渡す。設定しないと、vLLM が既定の経路の推測で自分のアドレスを決め、1 本のケーブルで 4 つのインターフェースが現れる Spark では外しやすい"
source = "https://github.com/vllm-project/vllm/blob/385dce36bcee42309924a5ece951a96db3dce7f2/vllm/envs.py"
quote = "used in distributed environment to determine the ip address of the current node, when the node has multiple network interfaces. If you are using multi-node inference, you should set this differently on each node."

[configs.glm53-tp2-mtp3-marlin.env.nccl-socket-ifname]
flag = "NCCL_SOCKET_IFNAME"
# 先頭の = は、前方一致ではなく完全一致にするための印である (NCCL の書式)
value = "={node.fabric_ifname}"
why = "NCCL のブートストラップと制御の経路を、直結のインターフェースに固定する。自動の検出に任せると、上がっているが通らないインターフェースを掴んで初期化で止まりうる。= を付けて、名前の完全一致にする"
source = "https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/env.html"
quote = "Define to a list of prefixes to filter interfaces to be used by NCCL. Multiple prefixes can be provided, separated by the , symbol. Using the ^ symbol, NCCL will exclude interfaces starting with any prefix in that list. To match (or not) an exact interface name, begin the prefix string with the = character. …"

[configs.glm53-tp2-mtp3-marlin.env.gloo-socket-ifname]
flag = "GLOO_SOCKET_IFNAME"
# Gloo では、= の完全一致も ^ の除外も文書化されていないので、名前をそのまま渡す
value = "{node.fabric_ifname}"
why = "CPU の側の集団通信が使う Gloo の経路も、同じ直結のインターフェースに固定する"
source = "https://docs.pytorch.org/docs/stable/distributed.html"
quote = "By default, both the NCCL and Gloo backends will try to find the right network interface to use. If the automatically detected interface is not correct, you can override it using the following environment variables (applicable to the respective backend) …"

[configs.glm53-tp2-mtp3-marlin.env.nccl-debug]
flag = "NCCL_DEBUG"
value = "INFO"
why = "起動のたびに NCCL の記録を採る。経路の確定の行 (Using network …) は INFO の段でしか出ない。2 台とも IB であることを、この記録から毎回確かめる"
source = "https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/env.html"
quote = "The NCCL_DEBUG variable controls the debug information that is displayed from NCCL. This variable is commonly used for debugging."

[configs.glm53-tp2-mtp3-marlin.env.nccl-debug-subsys]
flag = "NCCL_DEBUG_SUBSYS"
value = "INIT,NET"
why = "この起動で読みたいのは、経路の確定とデバイスの初期化だけなので、netcheck-bandwidth の INIT,BOOTSTRAP,ENV,NET,GRAPH より狭い INIT,NET にする"
source = "https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/env.html"
quote = "The default value is INIT,BOOTSTRAP,ENV. Supported subsystem names are INIT (stands for initialization), COLL (stands for collectives), P2P (stands for peer-to-peer), SHM (stands for shared memory), NET (stands for network), GRAPH (stands for topology detection and graph search) …"

[configs.glm53-tp2-mtp3-marlin.env.nccl-debug-file]
flag = "NCCL_DEBUG_FILE"
value = "/logs/nccl.%h.%p.log"
why = "2 台ぶんの記録を、mount-logs で結び付けた /logs に書き、serve logs で回収する。標準出力の起動の記録と混ぜない"
source = "https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/env.html"
quote = "The NCCL_DEBUG_FILE variable directs the NCCL debug logging output to a file. The filename format can be set to filename.%h.%p where %h is replaced with the hostname and %p is replaced with the process PID. …"

[configs.glm53-tp2-mtp3-marlin.env.vllm-sparse-indexer-max-logits-mb]
flag = "VLLM_SPARSE_INDEXER_MAX_LOGITS_MB"
value = "256"
why = "--max-num-batched-tokens 8192 と組で使う。固定した vLLM の indexer は、logits をこの上限 (既定 512 MB) 以下になるように行の向きに小分けにする。8192 × 128k では小分けが 2 回になり、2 回目の計算の間も 1 回目の logits が残って、ピークが約 1 GiB になる。上限を 256 MB にして、これを防ぐ。既定の上限のままでは、cold 128k が 1,141 tok/s に落ち、head で NV_ERR_NO_MEMORY が出た (docs/results/2026-10-01-mbt-8192-128k.md)。256 MB にした 2026-10-01 の実機の計測では、cold 128k が 1,576 tok/s で、NV_ERR_NO_MEMORY は 2 台とも 0 件だった。記録は docs/results/2026-10-01-mbt-8192-logits-256.md (#169)"
source = "https://github.com/vllm-project/vllm/blob/0961bbae2894d574be790d219651824eb199318e/vllm/envs.py"
quote = "Maximum size (in MB) for logits tensor in sparse MLA indexer prefill chunks. Bounds the [M, N] float32 logits tensor to prevent CUDA OOM. Default: 512 MB"
