why = "GB10 はユニファイドメモリなので、空きの見積もりが psutil の available になる (上の原文)。要る量は「全体 × この割合」で、それが空きを上回ると起動しない (`vllm/v1/worker/utils.py` の requested_memory。同じ commit)。段 0 で見たいのはアテンションの部品の可否なので、要求を小さくして、メモリの都合で落ちる筋道 (判定できなかった) を避ける"
