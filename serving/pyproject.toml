[project]
name = "serving-kit"
version = "0.1.0"
description = "DGX Spark 2 台に vLLM の推論サーバーを立てるためのコマンドラインの道具 (Serving Kit)"
authors = [
    { name = "Junichi Kato", email = "j5ik2o@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx~=0.28.1",
    "pydantic~=2.13.5",
]

[project.scripts]
serve = "serving_kit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serving_kit"]

[dependency-groups]
dev = [
    "pytest~=9.1.1",
    "ruff~=0.16.8",
    "mypy~=2.3.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
# tests/ 直下の助け (fake_runner.py、fake_vllm.py。あとのタスクで足す) を、
# どの試験からも import できるようにする (bench/pyproject.toml と同じ形)
mypy_path = "tests"

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ 直下の助けを、どの試験からも import できるようにする
pythonpath = ["tests"]
