# 対象サーバーの定義 (Requirement 1.1)。
#
# `[targets.<名前>]` が 1 つの対象サーバーに対応する。`<名前>` はこのテーブルの
# 鍵から取るので、テーブルの中に改めて `name` を書く必要はない (書いても無視
# される)。計測者は `bench run --target <名前>` のように、この名前で選ぶ。
#
# 認証の情報が要る対象サーバーでは、値そのものではなく、値を入れた環境変数の
# 名前を `api_key_env` に書く。実際の値は実行時に環境変数から読み、生データにも
# 要約にも書き出さない (Requirement 1.8)。このファイルに実在する秘密の値を
# 書いてはならない。

[targets.candidate-d]
base_url = "http://10.0.1.60:8001"
model = "glm-5.3-flash"
max_context_tokens = 1000000
notes = "比較の基準となる対象サーバー。中身 (量子化や投機的デコードの設定など) は参照しない"

# 2026-09-20 の時点で、head の 8001 番で動いている対象サーバー (コンテナ `exl3-tp2`、
# `vllm serve /models/glm-5.3-flash-exl3-full`、TP=2)。計測者が、この計測の道具とは別に起動したもの。
# 上の candidate-d と同じ構成かどうかは確かめていないので、名札を分けてある。道具の確かめ
# (タスク 8.2、8.3) は、この名前で測る。
[targets.exl3-tp2]
base_url = "http://10.0.1.60:8001"
model = "glm-5.3-flash"
max_context_tokens = 1000000
notes = "head の 8001 番の glm-5.3-flash (EXL3、TP=2)。candidate-d と同じ構成かは未確認"

# 自前イメージ (vllm-nope:0961bbae-fi070) を 2 台 TP=2 で起動したときの初回確認用
# (起動側の構成の名前も p2-nope-tp2-smoke)。実重みでの TP=2 の起動はまだ確認できて
# いないので、起動できたときに初めて使う。起動側は --max-model-len 4096、
# --max-num-seqs 1 なので (experiments/nope-mla/configure_tp2.py)、同時実行 1 の
# 初回の確認にだけ使い、並列性能や長文脈の測定には使わない。model はドットではなく
# ハイフンの glm-5-3-flash で、起動側の --served-model-name と揃えてある
# (serving/config/configs.toml)。max_context_tokens は、/v1/models が max_model_len
# を答えないときに使われる予備の値である。
[targets.p2-nope-tp2-smoke]
base_url = "http://10.0.1.60:8000"
model = "glm-5-3-flash"
max_context_tokens = 4096
notes = "自前イメージの TP=2 の初回確認 (短い文脈 4096、同時実行 1)。実重みでの起動は未確認"

# 自前で立てた対象サーバーの例。認証の情報 (api_key_env) と、対象サーバー固有の
# 内部指標の名前への上書き (metric_map) の書き方を示す (コメントアウトしてある
# ので、そのままでは読み込まれない)。
# [targets.own-p1]
# base_url = "http://10.0.1.60:8000"
# model = "glm-5.3-flash"
# max_context_tokens = 1000000
# notes = "上流の vLLM main、NVFP4、MTP k=1"
# api_key_env = "BENCH_OWN_API_KEY"
#
# metric_map に書くのは、`/metrics` のテキストを解析した**あと**のサンプルの名前である。
# カウンターは、対象サーバーの出力に `_total` が見えなくても、`_total` を付けて書く
# (例: "custom:prefix_cache_hits_total")。ヒストグラムは `_sum` と `_count` を書く。
# ゲージは、そのままの名前でよい。
# [targets.own-p1.metric_map]
# kv_usage = "custom:kv_cache_usage_ratio"
