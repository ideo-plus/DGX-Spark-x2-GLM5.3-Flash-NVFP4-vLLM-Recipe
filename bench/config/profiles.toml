# 計測の設定 (Requirement 1.1、1.6、2.2、4.1、6.8)。
#
# `[profiles.<名前>]` が 1 つの計測の設定に対応する。`<名前>` はこのテーブルの
# 鍵から取るので、テーブルの中に改めて `name` を書く必要はない。`Profile` の
# 全ての項目を、既定値と同じであっても省略せずに書く。このファイルが、すべて
# のつまみを見渡せる場所になるようにするため
#
# `probe` は探り (候補の比較、1 回 数分)、`fast` は確認 (有望な候補だけ、
# 15〜20 分)、`quick` は記録の最小、`full` は公開する結果を作る本番 (issue #39)。
# 差は主に試行の回数と出力の上限で、それ以外はそろえてある
#
# TOML には null (未設定) を書く記法がないので、既定が `None` の項目
# (`sampling.top_p`、`sampling.top_k`、`sandbox.image_digest`、
# `quality.code_problem_limit`) は、値を決めていない場合は省略する

[profiles.quick]
seed = 0
# quick は試行が少ない (入力の処理が 5 回、同時処理が 5 回ぶん) ので、5 にする。10 のままだと、
# 1 件も失敗していなくても、常に「試行が足りない」の印が付く
min_successes = 5
max_consecutive_failures = 5
length_tolerance = 0.05
compare_tolerance = 0.02
metrics_interval_s = 1.0

[profiles.quick.sampling]
temperature = 0.0
# top_p、top_k は既定の None のまま (省略)。thinking は、対象サーバーの既定しか選べない
# (2026-09-20 に実機で確かめたところ、/v1/messages からは切り替えられなかった。タスク 8.4)
thinking = "server_default"

[profiles.quick.chars_per_token]
# 2026-09-20 に `bench calibrate` で、実機の GLM-5.3-Flash のトークナイザーに対して測った値
# (対象: http://10.0.1.60:8001、1 種類につき約 2000 トークン、count_tokens)。要求の包みのぶん、
# わずかに小さく出る。モデルかトークナイザーを替えたら、測り直すこと
prose_en = 4.831
prose_ja = 1.794
code = 3.505
log = 2.316

[profiles.quick.timeout]
connect_s = 10.0
first_event_s = 120.0
idle_s = 60.0
total_s = 900.0

[profiles.quick.output_sanity]
repeat_min_chars = 12
repeat_min_count = 8

[profiles.quick.sandbox]
# この Mac では Docker Desktop を使う (タスク 6.1 で確かめて決めた。"auto" は podman、docker の順に探す)
runtime = "auto"
# 公式の python:3.13-slim (ダイジェストで固定) に numpy だけを足した、自前のイメージ。
# HumanEval+ の検査のプログラムが numpy を使うため。作り方は bench/sandbox/Dockerfile。
# image_digest は `docker image inspect <image> --format '{{.Id}}'` の値。作り直したら、書き換える
image = "bench-sandbox:py3.13-numpy2.5.3"
image_digest = "sha256:f75a1d43009306248ecbe68c0cc992b700a472037ba6ea336e519404ec1d1de6"
timeout_s = 20.0
memory_mb = 512
cpus = 1.0
pids_limit = 64

[profiles.quick.decode]
trials = 10
warmup_trials = 2
max_tokens = 1024

[profiles.quick.prefill]
trials = 5
warmup_trials = 1
max_tokens = 16
target_input_tokens = [8000, 32000, 128000]

[profiles.quick.concurrency]
levels = [1, 2, 4, 8]
# 5 回は、動くことを素早く確かめるための数。2 つの計測ランの比較に使うなら、
# `--set concurrency.rounds=20` で増やすこと (5 回では、同じ構成どうしでも「収まらない」が出た)
rounds = 5
max_tokens = 256
input_tokens = 2000

[profiles.quick.quality]
toolcall_tasks = 50
needle_lengths = [8000, 32000, 128000]
needle_depths = [0, 25, 50, 75, 100]
trials_per_cell = 2
code_max_tokens = 1024
code_problem_limit = 40

[profiles.quick.agent]
start_tokens = 20000
end_tokens = 120000
step_tokens = 20000
trials_per_stage = 50
conversations_per_stage = 5
threshold = 0.01
max_tokens = 256

[profiles.full]
seed = 0
min_successes = 10
max_consecutive_failures = 5
length_tolerance = 0.05
compare_tolerance = 0.02
metrics_interval_s = 1.0

[profiles.full.sampling]
temperature = 0.0
thinking = "server_default"

[profiles.full.chars_per_token]
# quick と同じ (2026-09-20 に実機の GLM-5.3-Flash で測った値)
prose_en = 4.831
prose_ja = 1.794
code = 3.505
log = 2.316

[profiles.full.timeout]
connect_s = 10.0
first_event_s = 120.0
idle_s = 60.0
total_s = 900.0

[profiles.full.output_sanity]
repeat_min_chars = 12
repeat_min_count = 8

[profiles.full.sandbox]
runtime = "auto"
image = "bench-sandbox:py3.13-numpy2.5.3"
image_digest = "sha256:f75a1d43009306248ecbe68c0cc992b700a472037ba6ea336e519404ec1d1de6"
timeout_s = 20.0
memory_mb = 512
cpus = 1.0
pids_limit = 64

[profiles.full.decode]
trials = 20
warmup_trials = 2
max_tokens = 1024

[profiles.full.prefill]
trials = 10
warmup_trials = 1
max_tokens = 16
target_input_tokens = [8000, 32000, 128000]

[profiles.full.concurrency]
levels = [1, 2, 4, 8]
# 実機 (2026-09-20、投機的デコードのある対象) では、5 回だと同じ構成どうしの比較で同時 2 本が
# 「収まらない」になり (+10.7%)、20 回で「収まる」になった (+1.2%)。公開する結果は 20 回で測る
rounds = 20
max_tokens = 256
input_tokens = 2000

[profiles.full.quality]
toolcall_tasks = 200
needle_lengths = [8000, 32000, 128000]
needle_depths = [0, 25, 50, 75, 100]
trials_per_cell = 4
code_max_tokens = 1024
# code_problem_limit は既定の None (省略)。HumanEval+ の全 164 問を使う

[profiles.full.agent]
start_tokens = 20000
end_tokens = 120000
step_tokens = 20000
trials_per_stage = 300
conversations_per_stage = 5
threshold = 0.01
max_tokens = 256

# 探り (probe)。候補を比べるときに 1 回 数分で回す。quick を元に decode と quality だけを
# 縮めた。decode は 4 条件 × (10 + 慣らし 1) = 44 要求、出力の上限は 44 × 128 = 5,632
# トークン。quality は ツール 5 + コード 1 + 探す課題 1 = 7 要求、出力の上限は
# 5×512 + 1×1024 + 1×512 = 4,096 トークン。decode と quality を合わせて約 5 分
# (2026-09-25 に N=2 で実測、issue #39)。prefill・concurrency・agent は quick のまま
# (issue の指定範囲)。decode.trials は ge=10 の下限なので、慣らしと max_tokens で縮める
[profiles.probe]
seed = 0
min_successes = 5
max_consecutive_failures = 5
length_tolerance = 0.05
compare_tolerance = 0.02
metrics_interval_s = 1.0

[profiles.probe.sampling]
temperature = 0.0
thinking = "server_default"

[profiles.probe.chars_per_token]
# quick と同じ (2026-09-20 に実機の GLM-5.3-Flash で測った値)
