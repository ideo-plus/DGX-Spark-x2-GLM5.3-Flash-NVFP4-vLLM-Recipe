# 確認 (fast)。有望な候補だけを 15〜20 分で確かめる。quick を元に decode、concurrency、
# quality を縮めた。decode は 44 要求、出力の上限は 44 × 256 = 11,264 トークン。
# concurrency は (2 回 + 慣らし 1 回) × (1+2+4) = 21 本、上限 21 × 128 = 2,688
# トークン (ほかに包みと文書の count_tokens)。quality は ツール 10 + コード 10 +
# 探す課題 2 = 22 要求、上限は 10×512 + 10×2048 + 2×512 = 26,624 トークン。時間は
# この機械 (1 本 14〜30 tok/s) で 15〜20 分の見込み (issue #39 の目安。実測は未確認。
# 上限どおり生成すると 23〜48 分だが、コードの回答は上限の前に終わる)。
# prefill・agent は quick のまま (issue の指定範囲)
[profiles.fast]
seed = 0
min_successes = 5
max_consecutive_failures = 5
length_tolerance = 0.05
compare_tolerance = 0.02
metrics_interval_s = 1.0

[profiles.fast.sampling]
temperature = 0.0
