trials = 10
warmup_trials = 1
max_tokens = 128

[profiles.probe.prefill]
trials = 5
warmup_trials = 1
max_tokens = 16
target_input_tokens = [8000, 32000, 128000]

[profiles.probe.concurrency]
levels = [1, 2, 4, 8]
rounds = 5
max_tokens = 256
input_tokens = 2000

[profiles.probe.quality]
# 探す課題は 1 点 (8,000 トークン、深さ 50%) だけ
