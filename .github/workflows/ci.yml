name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python / ${{ matrix.project }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [bench, serving]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          python-version: "3.12"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Check formatting
        run: uv run --frozen ruff format --check .
      - name: Check types
        run: uv run --frozen mypy
      - name: Test
        run: uv run --frozen pytest -q
      - name: Check preparation scripts
        if: matrix.project == 'serving'
        run: |
          uv run --frozen ruff check ../experiments/nope-mla
          uv run --frozen ruff format --check ../experiments/nope-mla
          sh -n ../scripts/run-takt-preparation.sh
